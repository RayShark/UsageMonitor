name: Linux CLI

on:
  push:
    branches: ["main", "linux-cli-*", "tmux-plugin-*", "release/v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, Test & Package
    runs-on: ubuntu-24.04
    container:
      image: swift:5.9-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Install tmux plugin test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl jq tmux
          rm -rf /var/lib/apt/lists/*

      - name: Validate shell scripts
        run: |
          bash -n scripts/build-linux-cli.sh
          bash -n usage-monitor.tmux tmux/usage-monitor.tmux
          bash -n tmux/scripts/usage-monitor-loop.sh tmux/scripts/usage-monitor-pane.sh tmux/scripts/usage-monitor-render.sh
          bash -n tmux/tests/*.sh

      - name: Run tmux plugin tests
        run: |
          for test in tmux/tests/*_test.sh; do
            bash "$test"
          done

      - name: Run core tests
        run: swift test --filter UsageMonitorCoreTests

      - name: Run CLI tests
        run: swift test --filter UsageMonitorCLITests

      - name: Build Linux amd64 package
        run: ./scripts/build-linux-cli.sh

      - name: Verify package checksum
        run: |
          cd build
          sha256sum -c usage-monitor-linux-amd64.tar.gz.sha256

      - name: Smoke packaged binary
        run: |
          mkdir -p /tmp/usage-monitor-smoke
          tar -xzf build/usage-monitor-linux-amd64.tar.gz -C /tmp/usage-monitor-smoke
          test -x /tmp/usage-monitor-smoke/usage-monitor
          /tmp/usage-monitor-smoke/usage-monitor --help

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: usage-monitor-linux-amd64
          path: |
            build/usage-monitor-linux-amd64.tar.gz
            build/usage-monitor-linux-amd64.tar.gz.sha256
          retention-days: 14
